name: nicolino
version: 0.25.0

authors:
  - Roberto Alsina <roberto.alsina@gmail.com>

targets:
  nicolino:
    main: src/main.cr

license: MIT

# Crystal version requirement
crystal: ">= 1.20.0"

dependencies:
  lua:
    github: veelenga/lua.cr
    version: ~> 0.4.0
  crinja:
    github: ralsina/crinja
    branch: perf/memoize-lookups
  RSS:
    github: ralsina/RSS.cr
    branch: master
  croupier:
    github: ralsina/croupier
    branch: main
  live_reload:
    github: bcardiff/live_reload.cr
  lexbor:
    github: kostya/lexbor
  cr-discount:
    github: ralsina/cr-discount
    branch: main
  shortcodes:
    github: ralsina/shortcodes
  tartrazine:
    github: ralsina/tartrazine
    version: ~> 0.21.2
  cronic:
    github: nanobowers/cronic
  baked_file_system:
    github: ralsina/baked_file_system
  progress_bar:
    github: mgomes/progress_bar
    branch: master
  sixteen:
    github: ralsina/sixteen
  vips:
    github: naqvis/crystal-vips
  crimage:
    github: naqvis/crimage
  oplog:
    github: ralsina/oplog
  polydocopt:
    github: ralsina/polydocopt
    branch: main
  toml:
    github: manastech/crystal-toml
    version: ~> 0.8.0

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.7.0
