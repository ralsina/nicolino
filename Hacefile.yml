variables:
  FLAGS: "-d --error-trace"
  NAME: "nicolino"

tasks:
  build:
    default: true
    dependencies:
      - src
      - shard.lock
      - shard.yml
      - Hacefile.yml
    outputs:
      - bin/{{NAME}}
    commands: |
      shards build {{FLAGS}}

  get-deps:
    dependencies:
      - shard.yml
    outputs:
      - shard.lock
    commands: |
      shards install

  build-release:
    phony: true
    always_run: true
    commands: |
      hace clean
      hace build FLAGS="--release"

  install:
    phony: true
    always_run: true
    dependencies:
      - bin/{{name}}
    commands: |
      rm ${HOME}/.local/bin/{{NAME}}
      cp bin/{{name}} ${HOME}/.local/bin/{{NAME}}

  lint:
    dependencies:
      - src
      - shard.lock
      - shard.yml
    commands: |
      crystal tool format src/*.cr
      bin/ameba --fix
    always_run: true
    phony: true

  test:
    dependencies:
      - bin/{{NAME}}
    commands: |
      NICOLINO_BIN="$PWD/bin/{{NAME}}" RUNS=1 ./bench/run.sh
    always_run: true
    phony: true

  theme-demos:
    dependencies:
      - bin/{{NAME}}
      - demo/conf.yml
      - themes/default
      - themes/minimal
      - themes/terminal
      - themes/papermod
    outputs:
      - assets/themes/demo/default
      - assets/themes/demo/minimal
      - assets/themes/demo/terminal
      - assets/themes/demo/papermod
    commands: |
      scripts/build-theme-demos.sh

  screenshots:
    dependencies:
      - assets/themes/demo/default
      - assets/themes/demo/minimal
      - assets/themes/demo/terminal
      - assets/themes/demo/papermod
    outputs:
      - assets/themes/shots/default.png
      - assets/themes/shots/minimal.png
      - assets/themes/shots/terminal.png
      - assets/themes/shots/papermod.png
    commands: |
      (cd scripts && npm install --silent && npx playwright install firefox)
      node scripts/screenshot-themes.js

  theme-registry:
    dependencies:
      - themes/default
      - themes/minimal
      - themes/terminal
      - themes/papermod
    outputs:
      - assets/themes.json
      - assets/themes/registry/default.tar.gz
      - assets/themes/registry/minimal.tar.gz
      - assets/themes/registry/terminal.tar.gz
      - assets/themes/registry/papermod.tar.gz
    commands: |
      scripts/build-theme-registry.sh

  deploy:
    phony: true
    always_run: true
    dependencies:
      - bin/nicolino
      - src
      - shard.lock
      - shard.yml
      - content
      - screenshots
      - theme-registry
    commands: |
      rm -rf content/bench/
      rm -rf output/
      bin/nicolino build -B
      rsync -rzav --delete output/* root@rocky:/data/stacks/web/websites/nicolino.ralsina.me/

  pre-commit:
    default: true
    outputs:
      - .git/hooks/commit-msgstatic
      - .git/hooks/pre-commit
    dependencies:
      - .pre-commit-config.yaml
    commands: |
      pre-commit install --hook-type commit-msg
      pre-commit install

  clean:
    phony: true
    always_run: true
    commands: |
      rm -rf shard.lock bin lib

  static:
    # Release artifacts: never reuse stale binaries across versions.
    phony: true
    always_run: true
    commands: |
      ./build_static.sh
