name: Benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install native dependencies (libvips, ragel)
        # Must precede `shards install`: the shortcodes postinstall
        # invokes ragel at build time.
        run: sudo apt-get update && sudo apt-get install -y libvips-dev ragel

      - name: Install benchmark tooling (hyperfine, jq)
        # hyperfine does the timing/statistics, jq assembles the report.
        run: sudo apt-get update && sudo apt-get install -y hyperfine jq

      - name: Install dependencies
        run: shards install

      - name: Install latest Hugo (for comparison)
        # The Ubuntu apt package is years behind (0.12x vs current 0.16x),
        # which skews the comparison; grab the latest release directly.
        run: |
          tag=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          ver=${tag#v}
          curl -sL "https://github.com/gohugoio/hugo/releases/download/${tag}/hugo_extended_${ver}_linux-amd64.tar.gz" -o /tmp/hugo.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/hugo.tgz hugo
          hugo version

      - name: Install latest Zola (for comparison)
        # Same reasoning as Hugo: get the current release from GitHub
        # instead of the outdated distro package.
        run: |
          tag=$(curl -s https://api.github.com/repos/getzola/zola/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          ver=${tag#v}
          curl -sL "https://github.com/getzola/zola/releases/download/${tag}/zola-v${ver}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/zola.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/zola.tgz zola
          zola --version

      - name: Build optimized (release) binary
        # --release takes ~20 minutes; done here in CI rather than locally.
        # `shards build` has no --output flag; it always writes to the target
        # default (bin/nicolino), so copy it aside for the harness.
        run: |
          shards build --release
          mkdir -p "${{ github.workspace }}/bench/release-bin"
          cp bin/nicolino "${{ github.workspace }}/bench/release-bin/nicolino"

      - name: Build normal (dev) binary
        # Rebuild dev afterwards so bin/nicolino is the dev binary for the harness.
        run: shards build -d

      - name: Run benchmark
        id: bench
        env:
          NICOLINO_BIN: "${{ github.workspace }}/bin/nicolino"
          NICOLINO_RELEASE_BIN: "${{ github.workspace }}/bench/release-bin/nicolino"
          RUNS: "3"
        run: ./bench/run.sh

      - name: Publish summary
        run: |
          latest=$(ls -t bench/results/*.json | head -1)
          echo "## Benchmark (dev + release)" >> "$GITHUB_STEP_SUMMARY"
          echo "Result file: \`${latest##*/}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results artifact
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: bench/results/*.json

      # Keep a current-ish baseline in the repo. Only done on manual
      # dispatch so pushes don't re-trigger the (slow) workflow.
      - name: Commit current result to repo
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest=$(ls -t bench/results/*.json | head -1)
          cp "$latest" bench/results/latest.json
          git add bench/results/latest.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "chore: refresh benchmark baseline [skip ci]"
          git push origin main
