name: Build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install native dependencies (libvips, ragel)
        # Must precede `shards install`: the shortcodes postinstall
        # invokes ragel at build time.
        run: sudo apt-get update && sudo apt-get install -y libvips-dev ragel liblua5.4-dev

      - name: Install dependencies
        run: shards install
      - name: Build
        run: shards build -d
      - name: Smoke test (build the benchmark corpus)
        # Builds the 4000-file vendored corpus and asserts every file renders.
        # Serves as a regression gate and exercises the render pipeline.
        # (A plain build + count, not bench/run.sh: timing benchmarks belong
        # to the dedicated Benchmark workflow.)
        run: |
          site=bench/site-nicolino
          rm -rf "$site/output"
          mkdir -p "$site/content"
          cp bench/corpus/*.md "$site/content/"
          ( cd "$site" && "$GITHUB_WORKSPACE/bin/nicolino" build --fast-mode -B -p )
          n=$(find "$site/output" -name '*.html' | wc -l)
          echo "rendered $n pages"
          test "$n" -eq "$(ls bench/corpus/*.md | wc -l)"
