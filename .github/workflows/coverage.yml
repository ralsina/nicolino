name: Build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v5
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install native dependencies (libvips, ragel)
        # Must precede `shards install`: the shortcodes postinstall
        # invokes ragel at build time.
        run: sudo apt-get update && sudo apt-get install -y libvips-dev ragel

      - name: Install benchmark tooling (hyperfine, jq)
        # The smoke test runs bench/run.sh, which needs both.
        run: sudo apt-get install -y hyperfine jq

      - name: Install dependencies
        run: shards install
      - name: Build
        run: shards build -d
      - name: Smoke test (build the benchmark corpus)
        # Builds the 4000-file vendored corpus and asserts every file renders.
        # Serves as a regression gate and exercises the render pipeline.
        run: |
          NICOLINO_BIN="$PWD/bin/nicolino" RUNS=1 ./bench/run.sh
